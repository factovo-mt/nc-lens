B = "Y 軸まわりの回転軸（度）"
C = "Z 軸まわりの回転軸（度）"
U = "X 軸に平行な付加軸"
V = "Y 軸に平行な付加軸"
W = "Z 軸に平行な付加軸"
I = "円弧の中心の X 成分（始点から）"
J = "円弧の中心の Y 成分（始点から）"
K = "円弧の中心の Z 成分（始点から）。固定サイクルの繰り返し回数"
R = "円弧の半径。固定サイクルの R 点"
F = "送り速度"
S = "主軸の回転数"
T = "工具の番号"
H = "工具長補正の番号"
D = "工具径補正の番号"
O = "プログラム番号"
N = "シーケンス番号"
P = "ドウェルの時間（ms）。呼び出すプログラムの番号"
L = "繰り返し回数"
Q = "深穴あけの 1 回の切り込み量"
G = "準備機能（G コード）"
M = "補助機能（M コード）"
