[package]
name = "nclens-app"
default-run = "nclens"
version = "0.2.6"
edition = "2021"
license.workspace = true
authors.workspace = true

[[bin]]
name = "nclens"
path = "src/main.rs"

[lib]
name = "nclens_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
nclens-core = { path = "../../crates/nclens-core" }
nclens-cli = { path = "../../crates/nclens-cli" }
