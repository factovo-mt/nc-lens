<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>NC Lens</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
      body { display: grid; place-items: center; font-family: "Segoe UI", "Yu Gothic UI", "Meiryo UI", sans-serif; }
      .card {
        position: relative; box-sizing: border-box; width: 440px; height: 280px; padding: 28px 30px 22px;
        display: grid; grid-template-columns: 170px 1fr; grid-template-rows: 1fr auto; column-gap: 24px;
        color: #d0d6e0; background: radial-gradient(120% 140% at 0% 0%, #2b303a 0%, #1e2128 55%, #171a20 100%);
        border: 1px solid #343a46; border-radius: 16px; overflow: hidden;
      }
      .card::after { content: ""; position: absolute; inset: 0; border-radius: 16px; pointer-events: none;
        background: linear-gradient(115deg, transparent 35%, rgba(229, 192, 123, 0.07) 50%, transparent 65%) -440px 0 / 200% 100% no-repeat;
        animation: sheen 0.9s 0.2s ease-out forwards; }
      svg { width: 170px; height: 170px; align-self: center; }
      .axis { stroke-width: 24; stroke-linecap: round; stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 0.25s ease-out forwards; }
      .rapid { fill: none; stroke: #8a93a6; stroke-width: 40; stroke-linecap: round; stroke-dasharray: 70 60; opacity: 0; animation: fade 0.2s 0.15s forwards; }
      .cut { fill: none; stroke: #e5c07b; stroke-width: 64; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 1320; stroke-dashoffset: 1320; animation: draw 0.55s 0.2s cubic-bezier(.45,.05,.35,1) forwards; }
      .side { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
      h1 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: 0.02em; color: #eef1f6; white-space: nowrap;
        opacity: 0; transform: translateY(6px); animation: rise 0.3s 0.05s ease-out forwards; }
      h1 span { color: #e5c07b; }
      .sub { margin-top: 6px; font-size: 12px; color: #8a93a6; white-space: nowrap; opacity: 0; animation: fade 0.3s 0.2s forwards; }
      .ver { margin-top: 14px; font: 12px "Cascadia Mono", Consolas, monospace; color: #aab2c0; white-space: nowrap; opacity: 0; animation: fade 0.3s 0.3s forwards; }
      .foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; min-width: 0; }
      #status { flex: 1; min-width: 0; font-size: 11px; color: #8a93a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .bar { position: relative; flex: none; width: 120px; height: 3px; border-radius: 2px; background: #343a46; overflow: hidden; }
      .bar i { position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 2px; background: #e5c07b; animation: slide 1.1s ease-in-out infinite; }
      .copy { font-size: 10px; color: #5c6472; white-space: nowrap; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes fade { to { opacity: 1; } }
      @keyframes rise { to { opacity: 1; transform: none; } }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes sheen { to { background-position: 440px 0; } }
      @media (prefers-reduced-motion: reduce) {
        *, .card::after { animation-duration: 1ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div class="card" role="status" aria-label="NC Lens を起動中">
      <svg viewBox="0 0 1024 1024" aria-hidden="true">
        <rect x="48" y="48" width="928" height="928" rx="200" fill="#262a33" />
        <path class="axis" d="M180 860 L180 180" stroke="#8fd16a" />
        <path class="axis" d="M180 860 L860 860" stroke="#f0707a" />
        <path class="rapid" d="M220 760 L560 760" />
        <path class="cut" d="M220 760 L220 300 L520 300 L520 560 L800 560" />
        <circle r="78" fill="#d0d6e0" opacity="0">
          <set attributeName="opacity" to="1" begin="0.2s" fill="freeze" />
          <animateMotion dur="0.55s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.45 0.05 0.35 1"
            path="M220 760 L220 300 L520 300 L520 560 L800 560" />
        </circle>
      </svg>
      <div class="side">
        <h1>NC <span>Lens</span></h1>
        <div class="sub">NC プログラムのマクロ展開とシミュレーション</div>
        <div class="ver" id="ver"></div>
      </div>
      <div class="foot">
        <span id="status">起動中…</span>
        <span class="bar"><i></i></span>
        <span class="copy">© FACTOVO</span>
      </div>
    </div>
    <script type="module" src="/src/splash.ts"></script>
  </body>
</html>
